[package]
name = "io_board_bootloader"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

defmt = "0.3"
defmt-rtt = "0.4"

embassy-stm32 = { version = "0.6", features = ["stm32f105rc", "defmt"] }

cancan-boot = { git = "https://github.com/tudsat-rocket/cancan", features = ["defmt"] }

# Optimize for size: the bootloader has to fit its 24K partition (see ../partitions.x), which a
# debug build barely does. Keep debuginfo for defmt and debugging.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 2

[profile.dev]
opt-level = "z"
