[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = [
    "probe-rs",
    "run",
    "--chip",
    "stm32f105rc",
    "--catch-hardfault",
    "--always-print-stacktrace",
    "--connect-under-reset",
    "--log-format",
    "{L} {m:white} {s}"
]

# Once flashed at least once, and assuming you have a working socketcan interface on the
# host, this can be used instead to flash via CAN:
#runner = "cancan flash 0xff"

rustflags = [
    "-C", "linker=flip-link",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    # This is needed if your flash or ram addresses are not aligned to 0x10000 in memory.x
    # See https://github.com/rust-embedded/cortex-m-quickstart/pull/95
    "-C", "link-arg=--nmagic",
]

[build]
target = "thumbv7m-none-eabi"

[env]
DEFMT_LOG = "debug,can_iso_tp=warn"
